<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MacVolume Tabs</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>MacVolume Tabs</h1>
  <p id="connection" role="status">Connecting…</p>
  <button id="reconnect">Reconnect to MacVolume</button>
  <h2 id="title">Current tab</h2>
  <p id="automatic"></p>
  <p id="error" role="alert"></p>
  <p class="hint">YouTube and YouTube Music tabs appear automatically when audio starts.
    Adjust each tab in MacVolume. No per-tab activation is needed.</p>
  <p class="hint">Extension ID: <code id="extension-id"></code></p>
  <script type="module" src="popup.js"></script>
</body></html>
