<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WinMix Tabs</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>WinMix Tabs</h1>
  <p id="connection" role="status">Connecting…</p>
  <button id="reconnect">Reconnect to WinMix</button>
  <h2 id="title">Current tab</h2>
  <p id="automatic"></p>
  <p id="error" role="alert"></p>
  <p class="hint">Audio/video tabs on HTTP and HTTPS sites appear automatically when playback starts. Allow site access in the extension settings.
    Adjust each tab in WinMix. No per-tab activation is needed.</p>
  <p class="hint">Extension ID: <code id="extension-id"></code></p>
  <script type="module" src="popup.js"></script>
</body></html>
